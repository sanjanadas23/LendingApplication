<p>npa-management works!</p>
<div class="npa-management-container">
    <h2>NPA Loan Management</h2>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

    <mat-card class="table-card">
        <mat-card-header>
            <mat-card-title>NPA Loans</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <mat-table [dataSource]="loans">
                <ng-container matColumnDef="loanId">
                    <mat-header-cell *matHeaderCellDef>Loan ID</mat-header-cell>
                    <mat-cell *matCellDef="let loan">{{ loan.loanId }}</mat-cell>
                </ng-container>
                <ng-container matColumnDef="customerId">
                    <mat-header-cell *matHeaderCellDef>Customer ID</mat-header-cell>
                    <mat-cell *matCellDef="let loan">{{ loan.customerId }}</mat-cell>
                </ng-container>
                <ng-container matColumnDef="amount">
                    <mat-header-cell *matHeaderCellDef>Amount</mat-header-cell>
                    <mat-cell *matCellDef="let loan">{{ loan.amount | currency }}</mat-cell>
                </ng-container>
                <ng-container matColumnDef="statusName">
                    <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
                    <mat-cell *matCellDef="let loan">{{ loan.statusName }}</mat-cell>
                </ng-container>
                <ng-container matColumnDef="actions">
                    <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
                    <mat-cell *matCellDef="let loan">
                        <button mat-raised-button color="warn" (click)="markAsNPA(loan)" [disabled]="loan.isNpa">
                            Mark as NPA
                        </button>
                        <button mat-raised-button color="primary" (click)="viewDocuments(loan.loanId)">
                            View Documents
                        </button>
                    </mat-cell>
                </ng-container>
                <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
            </mat-table>
            <div *ngIf="loans.length === 0" class="empty-message">No NPA loans found.</div>
        </mat-card-content>
    </mat-card>
</div>
